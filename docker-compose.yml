services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/officebridge.sqlite
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      DEFAULT_ROOM_EXPIRATION_MINUTES: ${DEFAULT_ROOM_EXPIRATION_MINUTES:-60}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
