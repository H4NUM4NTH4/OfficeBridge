name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev

      - name: Run backend smoke tests
        run: npm run test:smoke

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit

      - name: Build frontend
        run: npm run build

  docker:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build backend image
        run: docker build -t officebridge-backend:ci ./backend

      - name: Smoke-test backend image
        shell: bash
        env:
          TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail

          container="officebridge-backend-smoke-${TEST_ID}"
          data_volume="${container}-data"
          storage_volume="${container}-storage"
          container_created=false
          data_volume_created=false
          storage_volume_created=false

          cleanup() {
            status=$?
            trap - EXIT
            set +e

            if [[ "$container_created" == true ]]; then
              docker container rm --force "$container" >/dev/null || status=1
            fi
            if [[ "$storage_volume_created" == true ]]; then
              docker volume rm "$storage_volume" >/dev/null || status=1
            fi
            if [[ "$data_volume_created" == true ]]; then
              docker volume rm "$data_volume" >/dev/null || status=1
            fi

            exit "$status"
          }
          trap cleanup EXIT

          if docker container inspect "$container" >/dev/null 2>&1 || \
            docker volume inspect "$data_volume" >/dev/null 2>&1 || \
            docker volume inspect "$storage_volume" >/dev/null 2>&1; then
            echo "A disposable smoke-test resource already exists for ${TEST_ID}." >&2
            exit 1
          fi

          docker image inspect officebridge-backend:ci >/dev/null
          docker volume create "$data_volume" >/dev/null
          data_volume_created=true
          docker volume create "$storage_volume" >/dev/null
          storage_volume_created=true
          docker create --name "$container" --network none \
            --mount "type=volume,source=${data_volume},target=/app/data" \
            --mount "type=volume,source=${storage_volume},target=/app/storage" \
            officebridge-backend:ci >/dev/null
          container_created=true
          docker start "$container" >/dev/null

          configured_user="$(docker inspect --format '{{.Config.User}}' "$container")"
          if [[ "$configured_user" != "node" ]]; then
            echo "Expected container user node, got: $configured_user" >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

          runtime_identity="$(docker exec "$container" node -e 'console.log(`${process.env.DATABASE_PATH}|${process.env.STORAGE_PATH}|${process.getuid()}`)')"
          IFS='|' read -r database_path storage_path runtime_uid <<< "$runtime_identity"
          if [[ "$database_path" != "/app/data/officebridge.sqlite" || \
            "$storage_path" != "/app/storage" || ! "$runtime_uid" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unexpected runtime defaults or UID: $runtime_identity" >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

          ready=false
          for attempt in {1..30}; do
            if ! container_running="$(docker inspect --format '{{.State.Running}}' "$container" 2>&1)"; then
              echo "Unable to inspect backend container before /health check." >&2
              echo "$container_running" >&2
              docker logs "$container" >&2 || true
              exit 1
            fi

            if [[ "$container_running" != "true" ]]; then
              echo "Backend container stopped before /health became ready." >&2
              docker logs "$container" >&2 || true
              exit 1
            fi

            if docker exec "$container" node -e "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            echo "Backend image did not return HTTP 200 from /health." >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

      - name: Build frontend image
        run: docker build -t officebridge-frontend:ci ./frontend

      - name: Set up Node.js 24 for Compose integration tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install backend dependencies for Socket.IO client
        run: npm ci --prefix backend

      - name: Test Docker Compose integration
        shell: bash
        run: |
          set -Eeuo pipefail

          run_suffix="$(node -p "require('node:crypto').randomBytes(6).toString('hex')")"
          project="officebridge-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${run_suffix}"
          test_root="$(mktemp -d "${RUNNER_TEMP}/${project}.XXXXXX")"
          override_file="${test_root}/compose.override.yml"
          compose=(docker compose --project-name "$project" --file docker-compose.yml --file "$override_file")
          compose_started=false

          cleanup() {
            status=$?
            trap - EXIT
            set +e

            if [[ "$compose_started" == true ]]; then
              if [[ "$status" -ne 0 ]]; then
                echo "Compose integration test failed; recent service logs:" >&2
                "${compose[@]}" logs --no-color --tail=100 >&2 || true
              fi
              if ! "${compose[@]}" down --volumes --remove-orphans --timeout 30; then
                echo "Failed to clean up the isolated Compose project ${project}." >&2
                if [[ "$status" -eq 0 ]]; then status=1; fi
              fi
            fi

            if ! rm -rf -- "$test_root"; then
              echo "Failed to remove temporary test directory ${test_root}." >&2
              if [[ "$status" -eq 0 ]]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          cat > "$override_file" <<'COMPOSE'
          services:
            frontend:
              image: officebridge-frontend:ci
            backend:
              image: officebridge-backend:ci
              volumes:
                - integration-data:/app/data
                - integration-storage:/app/storage
          volumes:
            integration-data: {}
            integration-storage: {}
          COMPOSE

          FRONTEND_PORT="$(node -e '
            const net = require("node:net");
            const probe = net.createServer();
            probe.once("error", (error) => {
              console.error(`Unable to bind a temporary frontend port: ${error.message}`);
              process.exitCode = 1;
            });
            probe.listen(0, "0.0.0.0", () => {
              const port = probe.address().port;
              probe.close((error) => {
                if (error) {
                  console.error(`Unable to release the temporary frontend port: ${error.message}`);
                  process.exitCode = 1;
                } else {
                  console.log(port);
                }
              });
            });
          ')"
          if [[ ! "$FRONTEND_PORT" =~ ^[0-9]+$ ]]; then
            echo "Could not select an available frontend host port." >&2
            exit 1
          fi
          export FRONTEND_PORT
          export TEST_PROJECT="$project"

          if [[ -n "$(docker ps --all --quiet --filter "label=com.docker.compose.project=${project}")" || \
            -n "$(docker network ls --quiet --filter "label=com.docker.compose.project=${project}")" || \
            -n "$(docker volume ls --quiet --filter "label=com.docker.compose.project=${project}")" ]]; then
            echo "Compose project resources already exist for ${project}; refusing to reuse them." >&2
            exit 1
          fi

          if ! docker image inspect officebridge-backend:ci >/dev/null || \
            ! docker image inspect officebridge-frontend:ci >/dev/null; then
            echo "Expected prebuilt CI images are unavailable; refusing to build or pull replacements." >&2
            exit 1
          fi

          resolved_config="$("${compose[@]}" config --format json)"
          printf '%s' "$resolved_config" | node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(0, "utf8"));
            const services = config.services ?? {};
            assert.deepEqual(Object.keys(services).sort(), ["backend", "frontend"]);
            assert.equal(services.backend.image, "officebridge-backend:ci");
            assert.equal(services.frontend.image, "officebridge-frontend:ci");

            const mounts = services.backend.volumes ?? [];
            assert.equal(mounts.length, 2, "backend must have exactly two isolated storage mounts");
            assert.ok(mounts.every((mount) => mount.type === "volume"), "backend mounts must be named volumes, never bind mounts");
            assert.deepEqual(
              mounts.map((mount) => mount.target).sort(),
              ["/app/data", "/app/storage"],
            );
            const declaredVolumes = config.volumes ?? {};
            assert.deepEqual(Object.keys(declaredVolumes).sort(), ["integration-data", "integration-storage"]);
            for (const logicalName of ["integration-data", "integration-storage"]) {
              assert.ok(declaredVolumes[logicalName], `missing isolated volume ${logicalName}`);
              assert.notEqual(declaredVolumes[logicalName].external, true, `${logicalName} must be created for this project`);
              const resolvedName = declaredVolumes[logicalName].name ?? `${process.env.TEST_PROJECT}_${logicalName}`;
              const target = logicalName === "integration-data" ? "/app/data" : "/app/storage";
              const mount = mounts.find((candidate) => candidate.target === target);
              assert.ok(
                [logicalName, resolvedName].includes(mount.source),
                `backend target ${target} is not mounted on declared isolated volume ${logicalName}`,
              );
            }
            assert.equal((services.backend.ports ?? []).length, 0, "backend must not publish a host port");

            const ports = services.frontend.ports ?? [];
            assert.equal(ports.length, 1, "frontend must have exactly one host port mapping");
            assert.equal(String(ports[0].published), process.env.FRONTEND_PORT);
            assert.equal(Number(ports[0].target), 80);
            console.log("Compose isolation preflight passed: CI images, isolated volumes, and selected frontend port.");
          '

          compose_started=true
          if ! "${compose[@]}" up --detach --no-build --pull never; then
            echo "Compose could not start the isolated stack or bind frontend port ${FRONTEND_PORT}." >&2
            exit 1
          fi

          OFFICEBRIDGE_BASE_URL="http://127.0.0.1:${FRONTEND_PORT}" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const baseUrl = process.env.OFFICEBRIDGE_BASE_URL;
          if (!baseUrl) throw new Error('OFFICEBRIDGE_BASE_URL is required');

          const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function pollFrontend() {
            const deadline = Date.now() + 60_000;
            let lastResult = 'no response received';

            while (Date.now() < deadline) {
              try {
                const response = await fetch(`${baseUrl}/`, { signal: AbortSignal.timeout(3_000) });
                const html = await response.text();
                if (response.status === 200) {
                  assert.match(html, /id=["']root["']/, 'frontend response should contain the SPA root element');
                  console.log('PASS frontend SPA responds with HTTP 200');
                  return;
                }
                lastResult = `HTTP ${response.status}`;
              } catch (error) {
                lastResult = error.message;
              }
              await pause(1_000);
            }

            throw new Error(`Frontend did not become available within 60 seconds (${lastResult})`);
          }

          async function expectJson(path, expectedStatus, options = {}) {
            const response = await fetch(new URL(path, baseUrl), {
              ...options,
              signal: AbortSignal.timeout(15_000),
            });
            const body = await response.text();
            assert.equal(
              response.status,
              expectedStatus,
              `${options.method ?? 'GET'} ${path}: expected HTTP ${expectedStatus}, got ${response.status}; body: ${body.slice(0, 500)}`,
            );
            return { response, body, json: body ? JSON.parse(body) : undefined };
          }

          const jsonHeaders = { 'content-type': 'application/json' };
          await pollFrontend();

          const created = await expectJson('/api/rooms', 201, {
            method: 'POST',
            headers: jsonHeaders,
            body: JSON.stringify({ name: 'Compose integration room', displayName: 'CI owner', expirationMinutes: 60 }),
          });
          const roomCode = created.json?.room?.code;
          const ownerId = created.json?.user?.id;
          const ownerDisplayName = created.json?.user?.displayName;
          assert.ok(roomCode, 'room creation response must include room.code');
          assert.ok(ownerId, 'room creation response must include user.id');
          assert.ok(ownerDisplayName, 'room creation response must include user.displayName');
          console.log('PASS room creation through frontend proxy');

          const { createRequire } = await import('node:module');
          const require = createRequire(`${process.cwd()}/backend/package.json`);
          const { io: createSocket } = require('socket.io-client');
          const ownerSocket = createSocket(baseUrl, {
            auth: { roomCode, userId: ownerId },
            autoConnect: false,
            transports: ['websocket'],
            reconnection: false,
            timeout: 10_000,
          });
          try {
            const presence = await new Promise((resolve, reject) => {
              const timeout = setTimeout(() => reject(new Error('Timed out waiting for users:present')), 10_000);
              ownerSocket.once('users:present', (payload) => {
                clearTimeout(timeout);
                resolve(payload);
              });
              ownerSocket.once('connect_error', (error) => {
                clearTimeout(timeout);
                reject(error);
              });
              ownerSocket.connect();
            });
            assert.equal(ownerSocket.connected, true, 'Socket.IO client should connect');
            assert.equal(ownerSocket.io.engine.transport.name, 'websocket', 'Socket.IO must use WebSocket transport');
            assert.deepEqual(presence, { users: [{ id: ownerId, displayName: ownerDisplayName }] });
            console.log('PASS Socket.IO WebSocket connection through NGINX and users:present payload');
          } finally {
            ownerSocket.disconnect();
          }

          const joined = await expectJson(`/api/rooms/${encodeURIComponent(roomCode)}/join`, 201, {
            method: 'POST',
            headers: jsonHeaders,
            body: JSON.stringify({ displayName: 'CI guest' }),
          });
          const guestId = joined.json?.user?.id;
          assert.ok(guestId, 'join response must include user.id');
          const memberRoom = await expectJson(`/api/rooms/${encodeURIComponent(roomCode)}`, 200, {
            headers: { 'X-User-Id': guestId },
          });
          assert.ok(memberRoom.json?.members?.some((member) => member.id === ownerId));
          assert.ok(memberRoom.json?.members?.some((member) => member.id === guestId));
          console.log('PASS second participant joins and authenticated room lookup');

          const ownerHeaders = { 'X-User-Id': ownerId };
          const textContent = 'OfficeBridge Compose integration text';
          const shared = await expectJson(`/api/rooms/${encodeURIComponent(roomCode)}/texts`, 201, {
            method: 'POST',
            headers: { ...jsonHeaders, ...ownerHeaders },
            body: JSON.stringify({ content: textContent, language: 'text' }),
          });
          assert.equal(shared.json?.text?.content, textContent);
          const listedTexts = await expectJson(`/api/rooms/${encodeURIComponent(roomCode)}/texts`, 200, {
            headers: ownerHeaders,
          });
          assert.ok(listedTexts.json?.texts?.some((text) => text.id === shared.json.text.id));
          console.log('PASS authenticated shared text create and retrieval');

          const fileContent = 'OfficeBridge Compose integration file';
          const form = new FormData();
          form.append('file', new Blob([fileContent], { type: 'text/plain' }), 'compose-integration.txt');
          const uploadResponse = await fetch(new URL(`/api/rooms/${encodeURIComponent(roomCode)}/files`, baseUrl), {
            method: 'POST',
            headers: ownerHeaders,
            body: form,
            signal: AbortSignal.timeout(15_000),
          });
          const uploadBody = await uploadResponse.text();
          assert.equal(uploadResponse.status, 201, `file upload: expected HTTP 201, got ${uploadResponse.status}; body: ${uploadBody.slice(0, 500)}`);
          const uploaded = JSON.parse(uploadBody);
          const fileId = uploaded?.file?.id;
          assert.ok(fileId, 'file upload response must include file.id');

          const downloaded = await fetch(new URL(`/api/rooms/${encodeURIComponent(roomCode)}/files/${encodeURIComponent(fileId)}`, baseUrl), {
            headers: ownerHeaders,
            signal: AbortSignal.timeout(15_000),
          });
          assert.equal(downloaded.status, 200, `file download expected HTTP 200, got ${downloaded.status}`);
          assert.equal(await downloaded.text(), fileContent, 'downloaded file content must match the upload');

          const deleted = await fetch(new URL(`/api/rooms/${encodeURIComponent(roomCode)}/files/${encodeURIComponent(fileId)}`, baseUrl), {
            method: 'DELETE',
            headers: ownerHeaders,
            signal: AbortSignal.timeout(15_000),
          });
          assert.equal(deleted.status, 204, `file delete expected HTTP 204, got ${deleted.status}`);
          const finalFiles = await expectJson(`/api/rooms/${encodeURIComponent(roomCode)}/files`, 200, {
            headers: ownerHeaders,
          });
          assert.ok(Array.isArray(finalFiles.json?.files), 'file listing response must include files');
          assert.equal(finalFiles.json?.files?.some((file) => file.id === fileId), false);
          console.log('PASS authenticated file upload, matching download, deletion, and final listing');
          NODE

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: officebridge-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: officebridge-frontend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  publish-image:
    name: Publish backend image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Normalize GHCR image name
        id: image
        env:
          IMAGE_NAME: ${{ github.repository }}
        shell: bash
        run: echo "name=ghcr.io/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
