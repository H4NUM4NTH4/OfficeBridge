name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev

      - name: Run backend smoke tests
        run: npm run test:smoke

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit

      - name: Build frontend
        run: npm run build

  docker:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build backend image
        run: docker build -t officebridge-backend:ci ./backend

      - name: Smoke-test backend image
        shell: bash
        env:
          TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail

          container="officebridge-backend-smoke-${TEST_ID}"
          data_volume="${container}-data"
          storage_volume="${container}-storage"
          container_created=false
          data_volume_created=false
          storage_volume_created=false

          cleanup() {
            status=$?
            trap - EXIT
            set +e

            if [[ "$container_created" == true ]]; then
              docker container rm --force "$container" >/dev/null || status=1
            fi
            if [[ "$storage_volume_created" == true ]]; then
              docker volume rm "$storage_volume" >/dev/null || status=1
            fi
            if [[ "$data_volume_created" == true ]]; then
              docker volume rm "$data_volume" >/dev/null || status=1
            fi

            exit "$status"
          }
          trap cleanup EXIT

          if docker container inspect "$container" >/dev/null 2>&1 || \
            docker volume inspect "$data_volume" >/dev/null 2>&1 || \
            docker volume inspect "$storage_volume" >/dev/null 2>&1; then
            echo "A disposable smoke-test resource already exists for ${TEST_ID}." >&2
            exit 1
          fi

          docker image inspect officebridge-backend:ci >/dev/null
          docker volume create "$data_volume" >/dev/null
          data_volume_created=true
          docker volume create "$storage_volume" >/dev/null
          storage_volume_created=true
          docker create --name "$container" --network none \
            --mount "type=volume,source=${data_volume},target=/app/data" \
            --mount "type=volume,source=${storage_volume},target=/app/storage" \
            officebridge-backend:ci >/dev/null
          container_created=true
          docker start "$container" >/dev/null

          configured_user="$(docker inspect --format '{{.Config.User}}' "$container")"
          if [[ "$configured_user" != "node" ]]; then
            echo "Expected container user node, got: $configured_user" >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

          runtime_identity="$(docker exec "$container" node -e 'console.log(`${process.env.DATABASE_PATH}|${process.env.STORAGE_PATH}|${process.getuid()}`)')"
          IFS='|' read -r database_path storage_path runtime_uid <<< "$runtime_identity"
          if [[ "$database_path" != "/app/data/officebridge.sqlite" || \
            "$storage_path" != "/app/storage" || ! "$runtime_uid" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unexpected runtime defaults or UID: $runtime_identity" >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

          ready=false
          for attempt in {1..30}; do
            if ! container_running="$(docker inspect --format '{{.State.Running}}' "$container" 2>&1)"; then
              echo "Unable to inspect backend container before /health check." >&2
              echo "$container_running" >&2
              docker logs "$container" >&2 || true
              exit 1
            fi

            if [[ "$container_running" != "true" ]]; then
              echo "Backend container stopped before /health became ready." >&2
              docker logs "$container" >&2 || true
              exit 1
            fi

            if docker exec "$container" node -e "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            echo "Backend image did not return HTTP 200 from /health." >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

      - name: Build frontend image
        run: docker build -t officebridge-frontend:ci ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: officebridge-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: officebridge-frontend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  publish-image:
    name: Publish backend image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Normalize GHCR image name
        id: image
        env:
          IMAGE_NAME: ${{ github.repository }}
        shell: bash
        run: echo "name=ghcr.io/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
